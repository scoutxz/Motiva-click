<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motiva Click</title>
    <!-- Vincula o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Motiva Click</h1>
    
    <!-- Mostra o contador de cliques na tela -->
    <h2>Cliques: <span id="contador">0</span></h2>

    <!-- Botão que ativa a função de clique -->
    <button id="btn-principal" onclick="computarClique()">CLIQUE AQUI</button>

    <!-- Espaço onde a frase comum vai aparecer -->
    <p id="frase">Clique no botão para ver uma frase!</p>


    <!-- Vincula o arquivo de comportamento JavaScript -->
    <script src="script.js"></script>
</body>
</html>
